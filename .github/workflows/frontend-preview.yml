name: Frontend Build Check

on:
  push:
    branches:
      - main
      - "codex/**"
      - "preview/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
