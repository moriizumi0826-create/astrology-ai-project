<!DOCTYPE html>
<html class="light" lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Celestial Logic Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#0A192F",
              gold: "#D4AF37",
              paper: "#F8FAFC",
              line: "#D9E2EC",
              mist: "#EAF1F7",
              signal: "#8FB8D8",
            },
            boxShadow: {
              soft: "0 20px 45px rgba(10, 25, 47, 0.08)",
            },
            fontFamily: {
              sans: ["Manrope", "Noto Sans JP", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Manrope", "Noto Sans JP", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(212, 175, 55, 0.14), transparent 28%),
          linear-gradient(180deg, #f8fafc 0%, #eef4fb 100%);
      }
    </style>
  </head>
  <body class="min-h-screen text-ink">
    <div id="root"></div>
    <script type="module" src="/src/dashboard.jsx"></script>
  </body>
</html>
