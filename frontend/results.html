<!DOCTYPE html>
<html class="light" lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>The Celestial Atelier | Results</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,300;0,400;0,700;1,400&family=Manrope:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "primary-dim": "#53534d",
              background: "#fafaf5",
              primary: "#5f5f59",
              secondary: "#6d5f07",
              surface: "#fafaf5",
              "surface-container": "#ecefe7",
              "surface-container-low": "#f3f4ee",
              "surface-container-lowest": "#ffffff",
              "inverse-surface": "#0d0f0c",
              "on-primary": "#faf8f0",
              "on-surface": "#2e342d",
              "on-surface-variant": "#5b6159",
              "outline-variant": "#aeb4aa",
            },
            fontFamily: {
              notoSerif: ["Noto Serif", "serif"],
              manrope: ["Manrope", "sans-serif"],
              notoSansJP: ["Noto Sans JP", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Manrope", "Noto Sans JP", sans-serif;
      }
      .font-notoSerif {
        font-family: "Noto Serif", serif;
      }
      .reveal {
        opacity: 0;
        transform: translateY(10px);
        animation: fadeUp 0.8s cubic-bezier(0.2, 0, 0, 1) forwards;
      }
      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-surface text-on-surface selection:bg-[#f7e382]">
    <main class="min-h-screen bg-white px-4 pb-24 pt-4 sm:px-6 md:px-12 md:pt-6">
      <div class="max-w-7xl mx-auto">
        <div class="relative left-1/2 mb-12 w-[calc(100vw-24px)] -translate-x-1/2" id="dashboard-prototype"></div>

        <div class="mb-10 flex flex-col gap-3 sm:mb-16 md:items-end md:justify-between">
          <div class="flex flex-col gap-2">
            <label class="text-[10px] uppercase tracking-[0.3em] text-secondary font-bold">The Reading</label>
            <h1 class="text-3xl font-notoSerif text-primary sm:text-4xl md:text-5xl">Curated Results</h1>
            <span class="text-[10px] font-notoSansJP text-secondary/70">鑑定結果</span>
          </div>
        </div>

        <div class="relative left-1/2 mb-12 w-[calc(100vw-24px)] -translate-x-1/2" id="yearly-forecast"></div>

        <div class="hidden mb-12 bg-surface-container-low p-8" id="meta-card">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-sm text-on-surface-variant font-notoSansJP">
            <div><span class="block text-[10px] uppercase tracking-[0.2em] text-secondary mb-2">Name</span><span id="meta-name"></span></div>
            <div><span class="block text-[10px] uppercase tracking-[0.2em] text-secondary mb-2">Birth</span><span id="meta-birth"></span></div>
            <div><span class="block text-[10px] uppercase tracking-[0.2em] text-secondary mb-2">Place</span><span id="meta-place"></span></div>
          </div>
        </div>

        <div class="hidden mb-10 bg-[#f3ede0] text-[#5f5f59] px-6 py-5 font-notoSansJP text-sm leading-relaxed" id="error-box"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8" id="reading-grid">
          <article class="bg-surface-container-lowest p-10 min-h-[280px] flex flex-col justify-between">
            <div>
              <p class="text-[10px] uppercase tracking-[0.3em] text-secondary font-bold mb-4">Waiting</p>
              <h3 class="font-notoSerif text-2xl text-primary mb-4">Your reading will appear here.</h3>
              <p class="text-on-surface-variant leading-relaxed">
                まだ表示できる鑑定結果がありません。入力ページからホロスコープを算出してください。
              </p>
            </div>
          </article>
        </div>

        <div class="hidden mt-12 bg-inverse-surface text-on-primary p-10" id="chart-card">
          <p class="text-[10px] uppercase tracking-[0.3em] text-secondary font-bold mb-4">Natal Data</p>
          <pre class="whitespace-pre-wrap text-sm leading-7 font-manrope" id="chart-data"></pre>
        </div>
      </div>
    </main>

    <footer class="flex w-full flex-col items-start gap-2 border-t border-[#5f5f59]/10 bg-[#fafaf5] px-4 py-8 sm:flex-row sm:items-center sm:justify-between sm:px-6 md:px-12">
      <div class="pr-4 text-xl font-normal leading-tight font-notoSerif text-primary sm:text-2xl">The Celestial Atelier</div>
      <a
        class="text-xs tracking-[0.18em] uppercase text-primary transition-colors duration-500 hover:text-secondary sm:text-sm"
        href="/"
      >
        Back To Entry
      </a>
    </footer>

    <script type="module" src="/src/results-dashboard.jsx"></script>
    <script type="module" src="/src/yearly-forecast.jsx"></script>
    <script type="module" src="/src/results.js"></script>
  </body>
</html>
