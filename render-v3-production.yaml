services:
  - type: web
    name: celestial-atelier-v3-production-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.v3.app:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/v3/health
    buildFilter:
      paths:
        - backend/**
        - database/**
        - requirements.txt
        - render-v3-production.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: V3_ENVIRONMENT
        value: production
      - key: V3_BILLING_ENABLED
        value: false
      - key: V3_ALLOWED_ORIGINS
        sync: false
      - key: V3_ALLOWED_HOSTS
        sync: false
      - key: V3_SUPABASE_PROJECT_REF
        sync: false
      - key: V3_SUPABASE_URL
        sync: false
      - key: V3_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: V3_SUPABASE_SECRET_KEY
        sync: false
      - key: V3_STRIPE_SECRET_KEY
        sync: false
      - key: V3_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: V3_STRIPE_PRICE_JPY
        sync: false

  - type: web
    name: celestial-atelier-v3-production
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build:v3
    staticPublishPath: ./frontend/dist/v3
    buildFilter:
      paths:
        - frontend/**
        - render-v3-production.yaml
    envVars:
      - key: VITE_V3_API_BASE_URL
        sync: false
      - key: VITE_V3_ENVIRONMENT
        value: production
      - key: V3_INCLUDE_TEST_LOGIN
        value: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com; connect-src 'self' https://api.thecelestialatelier.com https://sxkhgczqvsewtsrcnbbe.supabase.co wss://sxkhgczqvsewtsrcnbbe.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
