services:
  - type: web
    name: celestial-atelier-v3-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.v3.app:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/v3/health
    buildFilter:
      paths:
        - backend/**
        - database/**
        - requirements.txt
        - render-v3.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: V3_ENVIRONMENT
        value: preview
      - key: V3_ALLOWED_ORIGINS
        value: https://celestial-atelier-v3-preview.onrender.com
      - key: V3_ALLOWED_HOSTS
        value: celestial-atelier-v3-api.onrender.com
      - key: V3_SUPABASE_URL
        sync: false
      - key: V3_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: V3_SUPABASE_SECRET_KEY
        sync: false
      - key: V3_STRIPE_SECRET_KEY
        sync: false
      - key: V3_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: V3_STRIPE_PRICE_JPY
        sync: false

  - type: web
    name: celestial-atelier-v3-preview
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build:v3
    staticPublishPath: ./frontend/dist/v3
    buildFilter:
      paths:
        - frontend/**
        - render-v3.yaml
    envVars:
      - key: VITE_V3_API_BASE_URL
        value: https://celestial-atelier-v3-api.onrender.com
      - key: V3_INCLUDE_TEST_LOGIN
        value: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
